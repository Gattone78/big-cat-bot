<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>housebot</title>
<style>
  :root {
    --bg: #0a0f1a;          /* deep night blue — a screen that reads as "off" */
    --ink: #f2e8d5;         /* warm bone white for captions */
    --listen: #8fdcd2;      /* aqua accent while listening */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  body {
    display: grid; place-items: center;
    font: 500 3.2vmin/1.3 "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
  }

  .head {
    width: 82vmin; display: grid;
    transform: translate(calc(var(--dx, 0vmin) * 0.5), calc(var(--dy, 0vmin) * 0.5)) scale(var(--breath, 1));
    transition: transform 900ms cubic-bezier(.2,.8,.2,1), filter 600ms ease;
  }
  .offline .head { filter: grayscale(.65) brightness(.45); }

  /* four faces stacked in one cell; data-face on <body> picks the visible one */
  .face {
    grid-area: 1 / 1; width: 100%; height: auto;
    opacity: 0; transform: scale(.72); filter: blur(8px); pointer-events: none;
    transition: opacity 500ms ease, transform 650ms cubic-bezier(.2,.8,.2,1), filter 500ms ease;
  }
  [data-face="pepper"]     .face.pepper,
  [data-face="hal9000"]    .face.hal9000,
  [data-face="terminator"] .face.terminator,
  [data-face="r2d2"]       .face.r2d2 { opacity: 1; transform: none; filter: none; }

  /* shared animation plumbing: JS sets --lid/--dx/--dy/--breath/--open/--talk on .head */
  .lid, .gaze, .jaw, .mouth-open { transform-box: fill-box; transform-origin: 50% 50%; }
  .lid  { transform: scaleY(var(--lid, 1)); transition: transform 140ms ease-out; }
  .gaze {
    transform: translate(calc(var(--dx, 0vmin) * 0.28), calc(var(--dy, 0vmin) * 0.45));
    transition: transform 500ms cubic-bezier(.2,.8,.2,1);
  }
  .jaw {
    transform: translateY(calc((var(--open, 0.8vmin) - 0.8vmin) * 0.55));
    transition: transform 70ms linear;
  }
  .glow, .blip { transition: opacity 120ms linear; }

  /* ---- pepper ---------------------------------------------------------- */
  .pepper .ring  { stroke: #59b7ff; opacity: .8; transition: stroke 400ms ease, opacity 400ms ease; }
  .pepper .halo  { stroke: #59b7ff; opacity: .22; transition: stroke 400ms ease, opacity 400ms ease; }
  .pepper .mouth-open { transform: scaleY(calc(.25 + var(--talk, 0) * 1.6)); transition: transform 70ms linear; }
  .listening .pepper .ring { stroke: var(--listen); opacity: 1; }
  .listening .pepper .halo { stroke: var(--listen); opacity: .4; }
  .thinking  .pepper .lid  { --lid: .55; }
  .thinking  .pepper .ring, .thinking .pepper .halo { animation: pulse 1.1s ease-in-out infinite; }
  .offline   .pepper .ring, .offline  .pepper .halo { opacity: .08; }

  /* ---- hal9000 --------------------------------------------------------- */
  .hal9000 .glow { opacity: .35; animation: pulse 4s ease-in-out infinite; }
  .listening .hal9000 .glow { opacity: .6; animation: none; }
  .thinking  .hal9000 .glow { animation: pulse 1s ease-in-out infinite; }
  .speaking  .hal9000 .glow { opacity: calc(.3 + var(--talk, 0) * .7); animation: none; }
  .offline   .hal9000 .glow { opacity: .05; animation: none; }

  /* ---- terminator ------------------------------------------------------ */
  .terminator .eyeglow { opacity: .55; }
  .listening .terminator .eyeglow { opacity: .95; }
  .thinking  .terminator .eyeglow { animation: pulse 1s ease-in-out infinite; }
  .speaking  .terminator .eyeglow { opacity: calc(.5 + var(--talk, 0) * .5); }
  .offline   .terminator .eyeglow, .offline .terminator .eyecore { opacity: .06; }

  /* ---- r2d2 ------------------------------------------------------------ */
  .r2d2 .r2glow { opacity: .3; }
  .r2d2 .blip   { opacity: .35; }
  .listening .r2d2 .r2glow { opacity: .8; }
  .listening .r2d2 .blip   { opacity: .9; }
  .thinking  .r2d2 .blip   { animation: pulse .8s ease-in-out infinite; }
  .thinking  .r2d2 .blip:nth-child(2n) { animation-delay: .4s; }
  .speaking  .r2d2 .r2glow { opacity: calc(.25 + var(--talk, 0) * .75); }
  .speaking  .r2d2 .blip   { opacity: calc(.2 + var(--talk, 0) * .8); }
  .speaking  .r2d2 .blip:nth-child(2n) { opacity: calc(.9 - var(--talk, 0) * .7); }
  .offline   .r2d2 .r2glow, .offline .r2d2 .blip, .offline .r2d2 .holo { opacity: .06; }

  @keyframes pulse { 50% { opacity: .25; } }

  .caption {
    position: fixed; left: 8vmin; right: 8vmin; bottom: 6vmin;
    text-align: center; opacity: 0; transition: opacity 400ms ease;
    color: var(--ink); text-wrap: balance;
  }
  .caption.show { opacity: .55; }
  .unlock {
    position: fixed; inset: 0; display: grid; place-items: end center;
    padding-bottom: 14vmin; color: var(--ink); opacity: .5; pointer-events: none;
  }
  .unlock.hidden { display: none; }
  .status {
    position: fixed; top: 2vmin; right: 2.5vmin; font-size: 2vmin; opacity: .35; color: var(--ink);
  }

  @media (prefers-reduced-motion: reduce) {
    .head, .face, .lid, .gaze, .jaw, .mouth-open, .caption { transition: none; }
    .glow, .ring, .halo, .blip, .eyeglow { animation: none !important; }
  }
</style>
</head>

<script>
(() => {
  const body = document.body;
  const head = document.getElementById('head');
  const caption = document.getElementById('caption');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const FACES = ['pepper', 'hal9000', 'terminator', 'r2d2'];

  let state = 'offline';
  let captionTimer = null;

  // ---- audio out: 24 kHz s16le PCM arrives as binary WebSocket frames ---------
  const SAMPLE_RATE = 24000;
  let ctx = null, nextTime = 0, sources = [];
  const unlockEl = document.getElementById('unlock');
  const statusEl = document.getElementById('status');
  let receivedSec = 0;
  function showStatus() {
    const sound = ctx ? `sound ${ctx.state}` : 'sound off';
    const mic = micWanted || micState !== 'off' ? ` · mic ${micState}` : '';
    statusEl.textContent = `${sound} · ${receivedSec.toFixed(1)}s received${mic}`;
  }

  function unlockAudio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
      ctx.resume().then(showStatus);
      ctx.onstatechange = showStatus;
      unlockEl.classList.add('hidden');
      showStatus();
    }
    if (micWanted && !micCtx) startMic(); // same gesture doubles as the mic permission prompt
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, unlockAudio, { once: false }));

  function playPcm(arrayBuf) {
    const i16 = new Int16Array(arrayBuf);
    receivedSec += i16.length / SAMPLE_RATE;
    showStatus();
    if (!ctx) return; // not unlocked yet
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    const buf = ctx.createBuffer(1, f32.length, SAMPLE_RATE);
    buf.copyToChannel(f32, 0);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    const startAt = Math.max(ctx.currentTime + 0.02, nextTime);
    src.start(startAt);
    nextTime = startAt + buf.duration;
    sources.push(src);
    src.onended = () => { sources = sources.filter((s) => s !== src); };
  }

  function flushAudio() {
    for (const s of sources) { try { s.stop(); } catch {} }
    sources = [];
    nextTime = 0;
  }

  // ---- mic uplink (MIC_SOURCE=face): capture here so the browser's echo
  // canceller sees the bot's voice (this page plays it) and removes it from
  // the mic before it ever reaches the brain — open speakers, no headphones.
  // Needs a secure context for getUserMedia: localhost is fine; over the LAN
  // serve HTTPS or start Chromium with --unsafely-treat-insecure-origin-as-secure.
  const MIC_RATE = 16000;              // what the brain's VAD/STT expect
  let micWanted = false;               // the brain asked for the page mic
  let micCtx = null, micStream = null, micState = 'off';

  const MIC_WORKLET = `
    class MicSender extends AudioWorkletProcessor {
      constructor() { super(); this.buf = new Int16Array(1024); this.n = 0; }
      process(inputs) {
        const ch = inputs[0] && inputs[0][0];
        if (ch) for (let i = 0; i < ch.length; i++) {
          const s = Math.max(-1, Math.min(1, ch[i]));
          this.buf[this.n++] = s < 0 ? s * 32768 : s * 32767;
          if (this.n === this.buf.length) {
            this.port.postMessage(this.buf.slice(0));
            this.n = 0;
          }
        }
        return true;
      }
    }
    registerProcessor('mic-sender', MicSender);`;

  function micStatus(s) { micState = s; showStatus(); }

  async function startMic() {
    if (micCtx || !micWanted) return;
    if (!navigator.mediaDevices?.getUserMedia) {
      micStatus('unavailable — open via localhost or https');
      return;
    }
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,   // the whole point: cancels this page's own playback
          noiseSuppression: true,
          autoGainControl: true,
        },
      });
      // A dedicated context at 16 kHz makes the browser do the resampling;
      // if it refuses that rate, capture at its default and announce it —
      // the brain resamples whatever rate we report.
      try { micCtx = new AudioContext({ sampleRate: MIC_RATE }); }
      catch { micCtx = new AudioContext(); }
      const url = URL.createObjectURL(new Blob([MIC_WORKLET], { type: 'text/javascript' }));
      await micCtx.audioWorklet.addModule(url);
      URL.revokeObjectURL(url);
      const node = new AudioWorkletNode(micCtx, 'mic-sender', { numberOfInputs: 1, numberOfOutputs: 0 });
      node.port.onmessage = (e) => { if (ws?.readyState === 1) ws.send(e.data.buffer); };
      micCtx.createMediaStreamSource(micStream).connect(node);
      announceMic();
      micStatus(`on @ ${micCtx.sampleRate} Hz`);
    } catch (e) {
      stopMic();
      micStatus(`error: ${e.name || e.message}`);
    }
  }

  function stopMic() {
    micStream?.getTracks().forEach((t) => t.stop());
    micCtx?.close().catch(() => {});
    micStream = null; micCtx = null;
    micStatus('off');
  }

  function announceMic() {
    if (micCtx && ws?.readyState === 1) ws.send(JSON.stringify({ type: 'mic-start', rate: micCtx.sampleRate }));
  }

  function setState(next) {
    if (next === state) return;
    state = next;
    body.className = next;   // className only; data-face persists across states
    if (next !== 'speaking') {
      head.style.setProperty('--open', '0.8vmin');
      head.style.setProperty('--talk', '0');
    }
    if (next === 'thinking') head.style.setProperty('--dx', '2vmin'), head.style.setProperty('--dy', '-2vmin');
    else if (next === 'listening') head.style.setProperty('--dx', '0'), head.style.setProperty('--dy', '1vmin');
    else head.style.setProperty('--dx', '0'), head.style.setProperty('--dy', '0');
  }

  function setFace(name) {
    body.dataset.face = FACES.includes(name) ? name : 'pepper';
  }

  function setLevel(level) {
    if (state !== 'speaking') return;
    head.style.setProperty('--open', (0.8 + level * 7).toFixed(2) + 'vmin');
    head.style.setProperty('--talk', level.toFixed(3));
  }

  function setCaption(text) {
    caption.textContent = text;
    caption.classList.add('show');
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => caption.classList.remove('show'), 4000);
  }

  // ---- liveliness: blinks, glances, breathing --------------------------------
  function blink() {
    if (state === 'offline' || state === 'thinking') return;
    head.style.setProperty('--lid', '0.08');
    setTimeout(() => head.style.setProperty('--lid', ''), 130);
  }
  (function blinkLoop() {
    setTimeout(() => { blink(); blinkLoop(); }, 2500 + Math.random() * 4000);
  })();

  if (!reduced) {
    (function glanceLoop() {
      setTimeout(() => {
        if (state === 'idle') {
          const dx = (Math.random() - 0.5) * 6, dy = (Math.random() - 0.5) * 3;
          head.style.setProperty('--dx', dx + 'vmin');
          head.style.setProperty('--dy', dy + 'vmin');
          setTimeout(() => { if (state === 'idle') { head.style.setProperty('--dx', '0'); head.style.setProperty('--dy', '0'); } }, 1400);
        }
        glanceLoop();
      }, 4000 + Math.random() * 6000);
    })();

    let t = 0;
    (function breathe() {
      t += 0.02;
      head.style.setProperty('--breath', (1 + Math.sin(t) * 0.012).toFixed(4));
      requestAnimationFrame(breathe);
    })();
  }

  // ---- transport ---------------------------------------------------------------
  let ws = null;
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { setState('idle'); announceMic(); }; // reclaim the mic after a reconnect
    ws.onclose = () => { setState('offline'); setTimeout(connect, 1500); };
    ws.onmessage = (ev) => {
      if (ev.data instanceof ArrayBuffer) { playPcm(ev.data); return; }
      const msg = JSON.parse(ev.data);
      if (msg.type === 'flush') flushAudio();
      else if (msg.type === 'state') setState(msg.state);
      else if (msg.type === 'face') setFace(msg.face);
      else if (msg.type === 'level') setLevel(msg.level);
      else if (msg.type === 'caption' && msg.role === 'bot') setCaption(msg.text);
      else if (msg.type === 'mic') {
        micWanted = !!msg.enabled;
        if (!micWanted) stopMic();
        else if (micCtx) announceMic();       // already capturing: re-announce on this socket
        else if (ctx) startMic();             // page already unlocked by a click
        else unlockEl.textContent = 'click or tap once to turn on sound + mic';
        showStatus();
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
