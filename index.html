<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>housebot</title>
<style>
  :root {
    --bg: #0a0f1a;          /* deep night blue — a screen that reads as "off" */
    --ink: #f2e8d5;         /* warm bone white for the eyes */
    --listen: #8fdcd2;      /* aqua tint while listening */
    --dim: #3a4258;         /* offline */
    --eye-w: 22vmin;
    --eye-h: 26vmin;
    --gap: 16vmin;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; cursor: none; }
  body {
    display: grid; place-items: center;
    font: 500 3.2vmin/1.3 "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
  }

  .head {
    display: grid; grid-template-columns: var(--eye-w) var(--gap) var(--eye-w);
    grid-template-rows: var(--eye-h) 8vmin; align-items: start; justify-items: center;
    transform: translate(var(--dx, 0), var(--dy, 0)) scale(var(--breath, 1));
    transition: transform 900ms cubic-bezier(.2,.8,.2,1);
  }
  .eye {
    width: var(--eye-w); height: var(--eye-h);
    background: var(--ink); border-radius: 46% 46% 48% 48% / 40% 40% 60% 60%;
    transform-origin: 50% 60%;
    transform: scaleY(var(--lid, 1)) scaleX(var(--wide, 1));
    transition: transform 140ms ease-out, background-color 500ms ease, border-radius 500ms ease;
  }
  .eye.right { grid-column: 3; }
  .mouth {
    grid-column: 1 / 4; grid-row: 2;
    width: 14vmin; height: var(--open, 0.8vmin);
    margin-top: 5vmin; background: var(--ink); border-radius: 4vmin;
    transition: height 70ms linear, width 300ms ease, background-color 500ms ease;
  }

  /* states */
  .listening .eye { background: var(--listen); --wide: 1.06; border-radius: 48% / 46%; }
  .listening .mouth { background: var(--listen); width: 10vmin; }
  .thinking .eye { --lid: .55; border-radius: 50% / 70%; }
  .thinking .mouth { width: 6vmin; }
  .speaking .eye { border-radius: 46% 46% 48% 48% / 44% 44% 56% 56%; }
  .offline .eye, .offline .mouth { background: var(--dim); }
  .offline .eye { --lid: .35; }

  .caption {
    position: fixed; left: 8vmin; right: 8vmin; bottom: 6vmin;
    text-align: center; opacity: 0; transition: opacity 400ms ease;
    color: var(--ink); text-wrap: balance;
  }
  .caption.show { opacity: .55; }
  .unlock {
    position: fixed; inset: 0; display: grid; place-items: end center;
    padding-bottom: 14vmin; color: var(--ink); opacity: .5; pointer-events: none;
  }
  .unlock.hidden { display: none; }
  .status {
    position: fixed; top: 2vmin; right: 2.5vmin; font-size: 2vmin; opacity: .35; color: var(--ink);
  }

  @media (prefers-reduced-motion: reduce) {
    .head, .eye, .mouth, .caption { transition: none; }
  }
</style>
</head>
<body class="offline">
  <div class="head" id="head">
    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth" id="mouth"></div>
  </div>
  <div class="caption" id="caption"></div>
  <div class="unlock" id="unlock">click or tap once to turn on sound</div>
  <div class="status" id="status">sound off</div>

<script>
(() => {
  const body = document.body;
  const head = document.getElementById('head');
  const mouth = document.getElementById('mouth');
  const caption = document.getElementById('caption');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let state = 'offline';
  let captionTimer = null;

  // ---- audio out: 24 kHz s16le PCM arrives as binary WebSocket frames ---------
  const SAMPLE_RATE = 24000;
  let ctx = null, nextTime = 0, sources = [];
  const unlockEl = document.getElementById('unlock');
  const statusEl = document.getElementById('status');
  let receivedSec = 0;
  function showStatus() {
    statusEl.textContent = ctx
      ? `sound ${ctx.state} · ${receivedSec.toFixed(1)}s received`
      : `sound off · ${receivedSec.toFixed(1)}s received`;
  }

  function unlockAudio() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
    ctx.resume().then(showStatus);
    ctx.onstatechange = showStatus;
    unlockEl.classList.add('hidden');
    showStatus();
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => addEventListener(ev, unlockAudio, { once: false }));

  function playPcm(arrayBuf) {
    const i16 = new Int16Array(arrayBuf);
    receivedSec += i16.length / SAMPLE_RATE;
    showStatus();
    if (!ctx) return; // not unlocked yet
    const f32 = new Float32Array(i16.length);
    for (let i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;
    const buf = ctx.createBuffer(1, f32.length, SAMPLE_RATE);
    buf.copyToChannel(f32, 0);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    // Jitter buffer: when the queue has run dry, restart LEAD seconds ahead so
    // the following chunks line up back-to-back instead of each starting late.
    const LEAD = 0.2;
    if (nextTime < ctx.currentTime + 0.01) nextTime = ctx.currentTime + LEAD;
    const startAt = nextTime;
    src.start(startAt);
    nextTime = startAt + buf.duration;
    sources.push(src);
    src.onended = () => { sources = sources.filter((s) => s !== src); };
  }

  function flushAudio() {
    for (const s of sources) { try { s.stop(); } catch {} }
    sources = [];
    nextTime = 0;
  }

  function setState(next) {
    if (next === state) return;
    state = next;
    body.className = next;
    if (next !== 'speaking') mouth.style.setProperty('--open', '0.8vmin');
    if (next === 'thinking') head.style.setProperty('--dx', '2vmin'), head.style.setProperty('--dy', '-2vmin');
    else if (next === 'listening') head.style.setProperty('--dx', '0'), head.style.setProperty('--dy', '1vmin');
    else head.style.setProperty('--dx', '0'), head.style.setProperty('--dy', '0');
  }

  function setLevel(level) {
    if (state !== 'speaking') return;
    const open = 0.8 + level * 7; // vmin
    mouth.style.setProperty('--open', open.toFixed(2) + 'vmin');
  }

  function setCaption(text) {
    caption.textContent = text;
    caption.classList.add('show');
    clearTimeout(captionTimer);
    captionTimer = setTimeout(() => caption.classList.remove('show'), 4000);
  }

  // ---- liveliness: blinks, glances, breathing --------------------------------
  function blink() {
    if (state === 'offline' || state === 'thinking') return;
    head.style.setProperty('--lid', '0.08');
    setTimeout(() => head.style.setProperty('--lid', ''), 130);
  }
  (function blinkLoop() {
    setTimeout(() => { blink(); blinkLoop(); }, 2500 + Math.random() * 4000);
  })();

  if (!reduced) {
    (function glanceLoop() {
      setTimeout(() => {
        if (state === 'idle') {
          const dx = (Math.random() - 0.5) * 6, dy = (Math.random() - 0.5) * 3;
          head.style.setProperty('--dx', dx + 'vmin');
          head.style.setProperty('--dy', dy + 'vmin');
          setTimeout(() => { if (state === 'idle') { head.style.setProperty('--dx', '0'); head.style.setProperty('--dy', '0'); } }, 1400);
        }
        glanceLoop();
      }, 4000 + Math.random() * 6000);
    })();

    let t = 0;
    (function breathe() {
      t += 0.02;
      head.style.setProperty('--breath', (1 + Math.sin(t) * 0.012).toFixed(4));
      requestAnimationFrame(breathe);
    })();
  }

  // ---- transport ---------------------------------------------------------------
  function connect() {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => setState('idle');
    ws.onclose = () => { setState('offline'); setTimeout(connect, 1500); };
    ws.onmessage = (ev) => {
      if (ev.data instanceof ArrayBuffer) { playPcm(ev.data); return; }
      const msg = JSON.parse(ev.data);
      if (msg.type === 'flush') flushAudio();
      else if (msg.type === 'state') setState(msg.state);
      else if (msg.type === 'level') setLevel(msg.level);
      else if (msg.type === 'caption' && msg.role === 'bot') setCaption(msg.text);
    };
  }
  connect();
})();
</script>
</body>
</html>
